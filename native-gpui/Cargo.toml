[package]
name = "aurora-native-gpui"
version = "2.1.1"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[[bin]]
name = "aurora-launcher-gpui"
path = "src/main.rs"

[dependencies]
aurora-launcher = { path = "../core", default-features = false, features = ["native-preview"] }
gpui-kit = { version = "=0.9.1", default-features = false, features = ["gpui-fast"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22"
# GPUI's existing image type is also needed for decoded core-owned RGBA.
image = { version = "=0.25.10", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Reuse the supported host's owned native pickers, without a second dialog stack.
# The Media widget adds the same GSMTC session and thumbnail features as native/.
windows = { version = "0.61", default-features = false, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
    "Foundation", "Foundation_Collections", "Media_Control", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
