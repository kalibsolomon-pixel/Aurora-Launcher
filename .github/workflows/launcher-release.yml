name: Aurora Launcher release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Launcher major.minor.patch version (Aurora Client is versioned separately)
        required: true
        type: string
      source_ref:
        description: Exact audited commit SHA (current main for a new release)
        required: true
        type: string
      installer_format:
        description: Windows installer format to publish
        required: true
        type: choice
        options:
          - nsis
          - both
      resume_release_id:
        description: Existing draft release ID to resume (leave empty for a new release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aurora-launcher-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: source
        name: Resolve exact reviewed source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
          INSTALLER_FORMAT: ${{ inputs.installer_format }}
          RESUME_RELEASE_ID: ${{ inputs.resume_release_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$VERSION" == '1.0.0' && "$INSTALLER_FORMAT" != 'nsis' ]]; then
            echo 'Aurora Launcher 1.0.0 publishes NSIS only' >&2
            exit 1
          fi
          test "$INSTALLER_FORMAT" != 'msi' # One Windows updater authority uses NSIS.
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$SOURCE_REF^{commit}"
          git fetch --no-tags origin main
          if [[ -z "$RESUME_RELEASE_ID" ]]; then
            test "$SOURCE_REF" = "$(git rev-parse refs/remotes/origin/main)"
          else
            git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/main
          fi
          git checkout --detach "$SOURCE_REF"
          node tools/release/verify-version.mjs --release "$VERSION"
          echo "sha=$SOURCE_REF" >> "$GITHUB_OUTPUT"
      - name: Check exact release state
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          RESUME_RELEASE_ID: ${{ inputs.resume_release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout main
          node tools/release/check-collision.mjs "$VERSION" "$SOURCE_SHA" "$RESUME_RELEASE_ID"

  build:
    needs: resolve
    runs-on: windows-latest
    environment: launcher-production
    env:
      # Public Aurora Client application identity, embedded by Rust at compile time.
      AURORA_DISCORD_APPLICATION_ID: '1553653987545317396'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify source and install dependencies
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node tools/release/verify-version.mjs --release $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Launcher version contract failed' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Test, check, and build
        shell: pwsh
        run: |
          if ($env:AURORA_DISCORD_APPLICATION_ID -ne '1553653987545317396') { throw 'Production Discord application configuration is missing or incorrect' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          node --test tools/release/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling tests failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Frontend check failed' }
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust check failed' }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Build with owner-provided production updater signing
        shell: pwsh
        env:
          AURORA_UPDATER_PUBKEY: ${{ vars.AURORA_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'aurora-production-updater.json'
          node tools/release/updater-release.mjs config $config
          if ($LASTEXITCODE -ne 0) { throw 'Production signing configuration is missing or invalid' }
          $env:AURORA_UPDATER_PUBKEY = $env:AURORA_UPDATER_PUBKEY.Trim()
          npm run tauri build -- --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Tauri installer build failed' }
      - name: Inspect and hash installer bytes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          FORMAT: ${{ inputs.installer_format }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          AURORA_UPDATER_PUBKEY: ${{ vars.AURORA_UPDATER_PUBKEY }}
        run: |
          & ./tools/release/windows-artifacts.ps1 -Version $env:VERSION -Format $env:FORMAT -Mode Pack -SourceSha $env:SOURCE_SHA -OutputDirectory (Join-Path $env:RUNNER_TEMP 'aurora-release-assets')
          if (-not $?) { throw 'Installer inspection failed' }
          $manifest = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'aurora-release-assets/release-assets.json') -Raw | ConvertFrom-Json
          @("## Validated Aurora Launcher $($manifest.version)", '', "Source commit: ``$($manifest.sourceSha)``", '', '| File | Format | Architecture | Bytes | SHA-256 |', '| --- | --- | --- | ---: | --- |') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          foreach ($asset in $manifest.artifacts) {
            "| $($asset.name) | $($asset.format) | $($asset.architecture) | $($asset.sizeBytes) | ``$($asset.sha256)`` |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-launcher-${{ inputs.version }}-${{ inputs.installer_format }}
          path: ${{ runner.temp }}/aurora-release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: windows-latest
    environment: launcher-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: aurora-launcher-${{ inputs.version }}-${{ inputs.installer_format }}
          path: ${{ runner.temp }}/aurora-release-assets
      - name: Recheck collision and transferred bytes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          FORMAT: ${{ inputs.installer_format }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RESUME_RELEASE_ID: ${{ inputs.resume_release_id }}
          GH_TOKEN: ${{ github.token }}
          AURORA_UPDATER_PUBKEY: ${{ vars.AURORA_UPDATER_PUBKEY }}
        run: |
          node tools/release/check-collision.mjs $env:VERSION $env:SOURCE_SHA $env:RESUME_RELEASE_ID
          if ($LASTEXITCODE -ne 0) { throw 'Release collision check failed' }
          & ./tools/release/windows-artifacts.ps1 -Version $env:VERSION -Format $env:FORMAT -Mode Verify -SourceSha $env:SOURCE_SHA -OutputDirectory (Join-Path $env:RUNNER_TEMP 'aurora-release-assets')
          if (-not $?) { throw 'Transferred installer verification failed' }
      - name: Create verified draft, publish, and redownload public bytes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          FORMAT: ${{ inputs.installer_format }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RESUME_RELEASE_ID: ${{ inputs.resume_release_id }}
          GH_TOKEN: ${{ github.token }}
          AURORA_UPDATER_PUBKEY: ${{ vars.AURORA_UPDATER_PUBKEY }}
        run: |
          $resume = if ($env:RESUME_RELEASE_ID) { [long]$env:RESUME_RELEASE_ID } else { 0 }
          & ./tools/release/publish.ps1 -Version $env:VERSION -Format $env:FORMAT -SourceSha $env:SOURCE_SHA -AssetsDirectory (Join-Path $env:RUNNER_TEMP 'aurora-release-assets') -ResumeReleaseId $resume
          if (-not $?) { throw 'Release publication or public-byte verification failed' }

  expose_update:
    needs: [resolve, build, publish]
    runs-on: windows-latest
    environment: launcher-production
    concurrency:
      group: aurora-launcher-production-update-authority
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: aurora-launcher-${{ inputs.version }}-${{ inputs.installer_format }}
          path: ${{ runner.temp }}/aurora-release-assets
      - name: Verify public signed assets and expose the single manifest last
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          AURORA_UPDATER_PUBKEY: ${{ vars.AURORA_UPDATER_PUBKEY }}
        run: |
          node tools/release/publish-manifest.mjs $env:VERSION $env:SOURCE_SHA (Join-Path $env:RUNNER_TEMP 'aurora-release-assets')
          if ($LASTEXITCODE -ne 0) { throw 'Single update manifest publication failed; retain immutable release artifacts' }
