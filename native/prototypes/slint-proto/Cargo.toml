[package]
name = "aurora-slint-proto"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
build = "build.rs"

# Bounded NATIVE-0 prototype. Not part of the shipped launcher.
[workspace]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
