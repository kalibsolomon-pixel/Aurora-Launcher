[package]
name = "aurora-native"
version = "2.1.1"
description = "Native (Slint) host for Aurora Launcher"
authors = ["Aurora Launcher contributors"]
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

# Standalone so the Tauri crate keeps its own lockfile/target layout. The
# lockfile was seeded from core/Cargo.lock so shared dependencies resolve
# to the exact versions the production launcher is tested with.
[workspace]

[[bin]]
name = "aurora-native"
path = "src/main.rs"

[features]
default = ["renderer-femtovg"]
# Acceptance builds only: honor AURORA_DIAGNOSTIC_DATA_ROOT in release builds
# so measurements never open the owner's data. Never enabled for distribution.
disposable-data-root = ["aurora-launcher/disposable-data-root"]
native-update-acceptance = ["disposable-data-root", "aurora-launcher/native-update-acceptance"]
# Accelerated default for responsive translucent Borealis surfaces. Software
# remains compiled as the unsupported-driver fallback and can be selected with
# SLINT_BACKEND=winit-software or a --no-default-features build. The accelerated
# path trades higher driver/private memory for lower CPU and dispatch latency.
renderer-femtovg = ["slint/renderer-femtovg"]

[dependencies]
# The launcher core without Tauri or WebView2.
aurora-launcher = { path = "../core", default-features = false, features = ["native-preview"] }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    # Window access for the custom title bar (drag, resize, focus events).
    "unstable-winit-030",
] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
    # Home Media widget: system media sessions and thumbnail decoding.
    "Foundation", "Foundation_Collections", "Media_Control", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT",
] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dev-dependencies]
# Synthetic media-session acceptance only, absent from distribution bindings.
windows = { version = "0.61", default-features = false, features = ["std", "Media_Playback", "Media_Core", "Media", "Storage"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the Aurora icon and version resource into the executable.
winresource = { version = "0.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
