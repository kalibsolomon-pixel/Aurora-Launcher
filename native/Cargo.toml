[package]
name = "aurora-native"
version = "1.4.2"
description = "Native (Slint) host for Aurora Launcher"
authors = ["Aurora Launcher contributors"]
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

# Standalone so the Tauri crate keeps its own lockfile/target layout. The
# lockfile was seeded from src-tauri/Cargo.lock so shared dependencies resolve
# to the exact versions the production launcher is tested with.
[workspace]

[[bin]]
name = "aurora-native"
path = "src/main.rs"

[features]
default = []
# Acceptance builds only: honor AURORA_DIAGNOSTIC_DATA_ROOT in release builds
# so measurements never open the owner's data. Never enabled for distribution.
disposable-data-root = ["aurora-launcher/disposable-data-root"]
# Opt-in OpenGL renderer for comparison; the software renderer is the default
# because it measured materially lower memory (docs/native-ui/BENCHMARKS.md).
renderer-femtovg = ["slint/renderer-femtovg"]

[dependencies]
# The launcher core without Tauri or WebView2.
aurora-launcher = { path = "../src-tauri", default-features = false }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
# Embeds the Aurora icon and version resource into the executable.
winresource = { version = "0.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
