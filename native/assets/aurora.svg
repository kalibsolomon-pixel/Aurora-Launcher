<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" role="img" aria-label="Aurora bold diagonal twisting ribbon logo">
<defs>
<linearGradient id="upper" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#138aab"/><stop offset=".32" stop-color="#27e3d2"/><stop offset=".65" stop-color="#65dce8"/><stop offset="1" stop-color="#a3c1ff"/></linearGradient>
<linearGradient id="lower" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2d4ed1"/><stop offset=".48" stop-color="#5d5ce8"/><stop offset="1" stop-color="#b17bfa"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8ffff" stop-opacity=".8"/><stop offset="1" stop-color="#a1d9ff" stop-opacity="0"/></linearGradient>
<linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1244a5"/><stop offset="1" stop-color="#563cb6"/></linearGradient>
</defs>
<!-- lower ribbon behind crest -->
<path d="M43 452 C125 330 208 236 291 221 C363 208 403 275 453 300 C516 330 563 248 604 72 C582 288 516 438 420 399 C358 374 330 303 269 302 C198 300 127 377 43 452Z" fill="url(#lower)"/>
<path d="M43 452 C136 349 211 286 269 302 C330 303 358 374 420 399 C516 438 582 288 604 72 C560 334 508 397 442 364 C380 332 355 262 291 255 C214 247 137 345 43 452Z" fill="#172c8e" opacity=".35"/>
<!-- upper sweeping teal ribbon -->
<path d="M32 428 C132 235 216 123 311 115 C406 109 452 226 497 231 C539 236 573 167 604 72 C574 266 524 342 449 311 C383 283 361 199 294 200 C207 202 125 326 32 428Z" fill="url(#upper)"/>
<path d="M32 428 C132 235 216 123 311 115 C406 109 452 226 497 231 C539 236 573 167 604 72 C553 211 517 269 475 262 C417 251 384 165 311 157 C214 145 129 303 32 428Z" fill="url(#edge)" opacity=".43"/>
<!-- dark undersurface on ribbon fold -->
<path d="M294 200 C361 199 383 283 449 311 C524 342 574 266 604 72 C571 233 521 303 464 286 C405 269 379 189 311 178Z" fill="url(#fold)" opacity=".48"/>
